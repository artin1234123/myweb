
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coffee Order</title>
  <style>
    :root {
      --bg-color: #f5f3f1;
      --text-color: #4a2c2a;
      --card-bg: #fff;
      --button-bg: #8b5e34;
      --button-hover: #704727;
      --orders-bg: #fff;
    }

    body.dark {
      --bg-color: #1e1e1e;
      --text-color: #f1f1f1;
      --card-bg: #2a2a2a;
      --button-bg: #a9744f;
      --button-hover: #8b5e34;
      --orders-bg: #333;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      transition: all 0.3s;
    }

    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .login-container h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .input-group {
      position: relative;
      width: 280px;
      margin-bottom: 20px;
    }

    .input-group .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: #7a5c58;
    }

    .input-group input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border: 2px solid #d1c0b3;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
      background: #f9f6f4;
    }

    .input-group input:focus {
      border-color: #8b5e34;
      box-shadow: 0 0 6px rgba(139, 94, 52, 0.4);
      background: #fff;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: var(--button-bg);
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: var(--button-hover);
    }

    #main {
      display: none;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: var(--button-bg);
      color: white;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .coffee-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.3s;
    }

    .coffee-card img {
      width: 100%;
      border-radius: 10px;
      height: 150px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .coffee-card select {
      margin: 5px 0;
      padding: 5px;
      border-radius: 8px;
      border: 1px solid #d1c0b3;
      outline: none;
    }

    .orders-popup {
      display: none;
      position: fixed;
      top: 60px;
      right: 20px;
      width: 320px;
      background: var(--orders-bg);
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      padding: 15px;
      z-index: 10;
      color: var(--text-color);
    }
  </style>
</head>
<body>
  <!-- ورود اسم -->
  <div class="login-container" id="loginPage">
    <h2>☕ Welcome! Please enter your name</h2>
    <div class="input-group">
      <span class="icon">👤</span>
      <input type="text" id="nameInput" placeholder="Your name...">
    </div>
    <button onclick="enterSite()">Enter</button>
  </div>

  <!-- صفحه اصلی -->
  <div id="main">
    <div class="topbar">
      <button onclick="toggleOrders()">Orders</button>
      <button onclick="toggleDarkMode()" id="modeBtn">🌙 Dark</button>
    </div>
    <h2 style="text-align:center;">Coffee Menu</h2>
    <div class="menu" id="menu"></div>

    <div class="orders-popup" id="ordersPopup">
      <h3>Orders</h3>
      <ul id="ordersList"></ul>
    </div>
  </div>

    const shotOptions = ["Double shot", "Single shot", "Light"];
    const tempOptions = ["Very hot", "Normal", "Ready to drink"];

    let orders = {};
    let currentUser = "";

    function enterSite() {
      const name = document.getElementById("nameInput").value.trim();
      if (!name) return alert("Please enter your name!");
      currentUser = name;
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("main").style.display = "block";
      renderMenu();
    }

    function renderMenu() {
      const menu = document.getElementById("menu");
      menu.innerHTML = "";
      coffees.forEach(coffee => {
        const card = document.createElement("div");
        card.className = "coffee-card";
        card.innerHTML = `
          <img src="${coffee.img}" alt="${coffee.name}">
          <h3>${coffee.name}</h3>
          <div>
            <select id="shot-${coffee.name}">
              ${shotOptions.map(s => `<option>${s}</option>`).join('')}
            </select>
          </div>
          <div>
            <select id="temp-${coffee.name}">
              ${tempOptions.map(t => `<option>${t}</option>`).join('')}
            </select>
          </div>
          <button onclick="orderCoffee('${coffee.name}')">Order</button>
        `;
        menu.appendChild(card);
      });
    }

    function orderCoffee(coffee) {
      if (orders[currentUser]) {
        alert("You already placed an order!");
        return;
      }
      const shot = document.getElementById(`shot-${coffee}`).value;
      const temp = document.getElementById(`temp-${coffee}`).value;
      orders[currentUser] = `${coffee} (${shot}, ${temp})`;
      alert("Your order has been placed: " + orders[currentUser]);
      renderOrders();
    }

    function renderOrders() {
      const list = document.getElementById("ordersList");
      list.innerHTML = "";
      for (let person in orders) {
        const li = document.createElement("li");
        li.textContent = `${person}: ${orders[person]}`;
        list.appendChild(li);
      }
    }

    function toggleOrders() {
      const popup = document.getElementById("ordersPopup");
      popup.style.display = popup.style.display === "block" ? "none" : "block";
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
      const btn = document.getElementById("modeBtn");
      if (document.body.classList.contains("dark")) {
        btn.textContent = "☀️ Light";
      } else {
        btn.textContent = "🌙 Dark";
      }
    }
  </script>
